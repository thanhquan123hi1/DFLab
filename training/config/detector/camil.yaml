# model setting
pretrained: null
model_name: camil
backbone_name: vit

# Cross-Attention Multiple Instance Learning (CAMIL): BitFit CLIP + SSPANet + Cross-Attention Fusion + Top-k MIL
clip_model_name: openai/clip-vit-large-patch14
use_patch: true
use_sspanet: true
cross_attn_heads: 4
cross_attn_dropout: 0.0
fusion_gamma_init: 0.0
lambda_mil: 0.3
mil_topk: 16
validation_dataset: [FaceForensics++]
validation_split: val
selection_dataset: FaceForensics++
grad_clip_norm: 5.0
log_interval: 100
# Loss settings (held constant across ablations)
weight_real: 1.0
weight_fake: 1.0
label_smoothing: 0.1

# backbone setting
backbone_config:
  mode: original
  num_classes: 2
  inc: 3
  dropout: false

# dataset
all_dataset:
  [
    FaceForensics++,
    FF-F2F,
    FF-DF,
    FF-FS,
    FF-NT,
    FaceShifter,
    DeepFakeDetection,
    Celeb-DF-v1,
    Celeb-DF-v2,
    DFDCP,
    DFDC,
    DeeperForensics-1.0,
    UADFV,
  ]
train_dataset: [FaceForensics++]
test_dataset: [Celeb-DF-v2, FaceShifter, DeeperForensics-1.0]

compression: c23
train_batchSize: 64
test_batchSize: 128
workers: 8
frame_num:
  train: 8
  test: 32
resolution: 224
with_mask: false
with_landmark: false

# data augmentation
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

# CLIP mean/std
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

# optimizer config
optimizer:
  type: adam
  adam:
    lr: 0.0003
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0
    amsgrad: false

# training config
lr_scheduler: cosine
lr_T_max: 15
lr_eta_min: 0.00001
nEpochs: 10
start_epoch: 0
save_epoch: 1
rec_iter: 100
logdir: /kaggle/tmp/logs
manualSeed: 1024
save_ckpt: true
save_feat: true
save_avg: true

# loss function
loss_func: cross_entropy
losstype: null

# metric
metric_scoring: auc

# cuda
ngpu: 1
cuda: true
cudnn: true
